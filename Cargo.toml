[package]
name = "mt-mqtt"
version = "0.1.0"
authors = ["nader marandi <nader.marandi@samim.net>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.35.1", features = ["full"] }
bytes = "1.5.0"
num-traits = "0.2.17"
num-derive = "0.4.1"
strum = "0.25.0"
strum_macros = "0.25.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"], optional = true }

[features]
default = []
sqlite = ["dep:sqlx"]

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
rand = "0.8"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[bench]]
name = "broker_bench"
harness = false

[[bench]]
name = "persistence_bench"
harness = false